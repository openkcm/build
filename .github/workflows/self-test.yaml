name: Self test

# Every other workflow here is 'workflow_call' only, so nothing in this repository exercises its
# own taskfiles and scripts -- a defect cannot fail until it fails in a consuming repo's release.
# This runs self-test.sh, which drives the build system against a throwaway consuming repo.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # This repo has no go.mod of its own; the fixture targets go 1.24.
          go-version: '1.24'
          cache: false

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install OCM CLI
        run: |
          curl -sSfL https://ocm.software/install.sh | OCM_VERSION="0.24.0" bash -s "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run self test
        run: ./self-test.sh
