name: Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tag:
    # Accepts push / workflow_dispatch / pull_request, so a caller can pick any of them.
    # 'push' is recommended: it runs after the merge commit exists, which is settled enough for
    # release-please to see a merged release PR and tag it in the same run. 'pull_request' fires the
    # instant the PR closes, before the API consistently reports the merge, so the tag often only
    # appears on a later run. It is kept so existing callers keep working.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.title, 'chore(main)') &&
       contains(github.event.pull_request.title, 'release') &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf  # v2.2.1 # zizmor: ignore[github-app]
        with:
          app-id: ${{ secrets.APP_PUSH_TAG_ID }}
          private-key: ${{ secrets.APP_PUSH_TAG_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "${{ github.event.repository.name }}"

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-tags: true
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo RELOADAGENT | gpg-connect-agent
          git config --global user.name "GitHub CI Bot"
          git config --global user.email "github-ci[bot]@users.noreply.github.com"
          git config --global user.signingkey "${{ secrets.GPG_KEY_ID }}"
          git config --global commit.gpgsign true
          git config --global tag.gpgSign true
          git config --global gpg.program gpg


      - name: Release Please
        id: github_release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 #v4.4.0
        with:
          release-type: go
          token: ${{ steps.generate-token.outputs.token }}

      # Not an error: release-please either cuts a release or opens/updates the release PR.
      # It also needs a second run to tag a release PR that was merged in the meantime, so failing
      # here turned a normal first pass red and forced a manual re-trigger.
      - name: Report that no release was cut
        if: ${{ steps.github_release.outputs.release_created != 'true' }}
        run: |
          echo "::notice title=No release cut::release-please opened or updated the release PR instead of cutting a release. Merge it to publish; the following steps are skipped."

      - name: Setup
        if: ${{ steps.github_release.outputs.release_created == 'true' }}
        run: |
          mkdir assets
          echo "repo_name=$(basename "$GITHUB_REPOSITORY")" >> $GITHUB_ENV

      - name: Generate SBOM
        if: ${{ steps.github_release.outputs.release_created == 'true' }}
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f #v2.0.0
        with:
          version: v1
          args: mod -json -licenses -output ./assets/sbom.json
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}


      - name: Run Trivy SBOM vulnerability scanner
        if: ${{ steps.github_release.outputs.release_created == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'sbom'
          scan-ref: "./assets/sbom.json"
          format: 'json'
          output: './assets/trivy-sbom-vuln.json'

      - name: Run Trivy repository scan (dependencies from lock files)
        if: ${{ steps.github_release.outputs.release_created == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          token-setup-trivy: ${{ steps.generate-token.outputs.token }}
          scan-type: repository
          scan-ref: '.'
          format: json
          output: ./assets/trivy-repository-vuln.json
          severity: CRITICAL,HIGH,MEDIUM

      - name: Run Trivy security scanner
        if: ${{ steps.github_release.outputs.release_created == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          token-setup-trivy: ${{ steps.generate-token.outputs.token }}
          scan-type: fs
          scan-ref: '.'
          format: json
          output: ./assets/trivy-iac-vuln.json
          severity: CRITICAL,HIGH,MEDIUM
          additional-args: '--scanners misconfig,secret'

      - name: Upload Release Artifact
        if: ${{ steps.github_release.outputs.release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_TAG: ${{ steps.github_release.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./assets/**

