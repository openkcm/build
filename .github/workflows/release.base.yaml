name: Release

on:
  workflow_call:
    inputs:
      release-type:
        required: false
        default: "go"
        type: string

# Release-please is not safe to run twice at once: two invocations can both try to tag the same
# merged release PR. Several repos call this on 'push' AND 'pull_request', which both fire when a
# release PR is merged, so serialise per repo+branch. Queued rather than cancelled: a cancelled run
# can leave a release PR merged but untagged.
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    # Accepts three triggers, so a caller can pick any of them:
    #
    #   push (recommended)  - runs after the merge commit exists, which is settled enough for
    #                         release-please to see a merged release PR and tag it in one go.
    #   workflow_dispatch   - manual run.
    #   pull_request        - the original trigger, kept so existing callers keep working. It fires
    #                         the instant the PR closes, before the API consistently reports the
    #                         merge, so release-please's tagging phase often finds nothing to do and
    #                         the tag only appears on a later run.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.title, 'chore(main)') &&
       contains(github.event.pull_request.title, 'release') &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf  # v2.2.1 # zizmor: ignore[github-app]
        with:
          app-id: ${{ secrets.APP_PUSH_TAG_ID }}
          private-key: ${{ secrets.APP_PUSH_TAG_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "${{ github.event.repository.name }}"

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-tags: true
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo RELOADAGENT | gpg-connect-agent
          git config --global user.name "GitHub CI Bot"
          git config --global user.email "github-ci[bot]@users.noreply.github.com"
          git config --global user.signingkey "${{ secrets.GPG_KEY_ID }}"
          git config --global commit.gpgsign true
          git config --global tag.gpgSign true
          git config --global gpg.program gpg


      - name: Release Please
        id: github_release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 #v4.4.0
        with:
          release-type: ${{inputs.release-type}}
          target-branch: ${{ inputs.target-branch || github.ref_name }}
          token: ${{ steps.generate-token.outputs.token }}

      # Not an error: release-please either cuts a release or opens/updates the release PR.
      # It also needs a second run to tag a release PR that was merged in the meantime, so failing
      # here turned a normal first pass red and forced a manual re-trigger.
      - name: Report that no release was cut
        if: ${{ steps.github_release.outputs.release_created != 'true' }}
        run: |
          echo "::notice title=No release cut::release-please opened or updated the release PR instead of cutting a release. Merge it to publish; the following steps are skipped."

      - name: Setup
        if: ${{ steps.github_release.outputs.release_created == 'true' }}
        run: |
          mkdir assets
          
      - name: Upload Release Artifact
        if: ${{ steps.github_release.outputs.release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_TAG: ${{ steps.github_release.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./assets/**

